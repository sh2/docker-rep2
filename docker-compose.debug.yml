services:
  rep2php8:
    build:
      additional_contexts:
        p2-rep2: ../p2-php
        2chproxy.pl: ../2chproxy.pl
      args:
        DEBUG: on
    image: rep2-dbg:latest
    environment:
      NCPX_LOG_LEVEL: 7

# for Xdebug
    volumes:
      - ./xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini
    extra_hosts:
      - "host.docker.internal:host-gateway"

# for tshark
    cap_add:
      - NET_ADMIN
      - NET_RAW
